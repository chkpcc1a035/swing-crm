name: Build and Push to GCR

on:
  push:
    branches: [nextjs] # or your default branch
  pull_request:
    branches: [nextjs]

env:
  PROJECT_ID: swing-cms-449317
  IMAGE: swing-cms
  REGISTRY: asia-east2-docker.pkg.dev
  REPOSITORY: swing

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: "auth"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-east2-docker.pkg.dev

      - name: Build Docker image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --build-arg SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY \
            --tag "$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}" \
            --tag "$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}"
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy swing-cms \
            --image=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            --platform=managed \
            --region=asia-east1 \
            --service-account=github-actions-sa@swing-cms-449317.iam.gserviceaccount.com \
            --port=3000 \
            --memory=512Mi \
            --cpu=1000m \
            --allow-unauthenticated \
            --project=$PROJECT_ID \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="NEXT_PUBLIC_BASE_URL=https://swing-cms-250329887324.asia-east1.run.app"
